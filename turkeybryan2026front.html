	<style>
:root {

}

    body {
		height: 87vh;
      background-color: black;
      font-family: Helvetica, Arial, sans-serif;
      padding: 0;
      margin: 0;
	  box-sizing: border-box;
      //overflow: hidden;
    }

 /* menu */ 
 
 /* holds menu */
.container {
    position: relative;
	height: 87vh;
	width: 100%;
	
}
 
.icons {
position: absolute;
bottom: 0;
left: 0;
    width: 100%;
    height: 100%;
	//background: indigo;
	background-image: url("sueno1.png");
	height: 87vh;
  background-position: center;
  background-repeat: no-repeat;
  background-size: cover;
  position: relative;
	
	
	
	
	display: flex;
	align-items: flex-end;
  justify-content: center;
}	

#img1x,
#img2x,
#img3x,

#img5x {
	padding: 5vw;
	//width: 20vw;
//background: yellow;

}

#img1x,
#img3x,
#img5x {
	background: gray;
}

#img2x {
	background: lightgray;
}


.img1a {
	width: 25vw;
	text-align: center;
	font-size: 2.5vh;
	color: black;
}

/* end of menu */

/* point at which pages are inserted */
#replace {
	color: white;
	font-size: 7vw;
	background: cyan;
	height: 100%;
}

#bluescreen {
	display: block;
	color: white;
	font-size: 7vw;
	background: blue;
	background-image: url("Sueno-hotels.webp");
	height: 87vh;


    width:100%;
    height:100%;
    position:absolute;
    top:0;
    right:-100%;
    //background-color: blue;
    color:white;
    transition: 0.1s ease;

 //animation: slidein 2s;
}

.bs {
	animation: slidein 2s;
}

@keyframes slidein {
  0% { right: -100%;}
  100% { right: 0; display: block;}
}



#redscreen {
	display: none;
	color: white;
	font-size: 7vw;
	background: red;
	height: 100%;


    width:100%;
    height:100%;
    position:absolute;
    top:0;
    right:-100%;
    //background-color: red;
    color:white;
    transition: 4s ease;


}


.imgbackcontainer {
	position:absolute;
    bottom:1vh;
    left: 2vw;
	width: 20vw;
	height: 20vw;
    //background-color: green;
	border-radius: 50%;
    color:white;
	opacity: 0;
	display: flex;
	align-items: center;
  justify-content: center;
  font-size: 20vw;
  animation: fadein 4s;
  opacity: 1;
}


@keyframes fadein {
  0% { opacity: 0; }
  100% { opacity: 1; }
}

#spacer {
	height: 2vh;
}


</style>
</head>
<body>
<!-- main menu --> 
<div class="container">
  <div id="replace">
  <!-- main menu and pages go in here --> 
  <div class="icons" id="icons">
     <div class="img1a" onclick="showblue()">
        <img id="img1" style="border: 0; height: 15vw; width: 15vw; " src="info.png" alt="x1">
		<br>info<br>&nbsp;

     </div>
	 <!--
     <div class="img1a" onclick="showred()">
        <img id="img2" style="border: 0; height: 15vw; width: 15vw; " src="down.png" alt="x2">
		results<br>&nbsp;

     </div>
	 -->
     <div class="img1a" onclick="showred()">
        <img id="img3" style="border: 0; height: 15vw; width: 15vw; " src="teetimes.png" alt="x3">
		<br>tee<br>times
		<div id="spacer"></div>
     </div> 
     <div class="img1a">
        <img id="img4" style="border: 0; height: 15vw; width: 15vw; " src="results.png" alt="x4">
		<br>daily<br>results
		<div id="spacer"></div>
     </div>
     <div class="img1a">
        <img id="img5" style="border: 0; height: 15vw; width: 15vw; " src="finalresults.png" alt="x5">
		<br>final<br>results
		<div id="spacer"></div>
     </div>
  </div>
  
  <!-- -alternative screens here -->
  
  <!-- info -->
  <div id="bluescreen">
  bluescreen
  <div class="imgbackcontainer">
  <img id="imgback" onclick= "clearblue()" style="border: 0; height: 20vw; width: 20vw; " src="arrow.png" alt="x0">
  </div>
  </div>
  <!-- results -->
  <div id="redscreen">
  redscreen
  <div class="imgbackcontainer">
  <img id="imgback" onclick= "clearred()" style="border: 0; height: 20vw; width: 20vw; " src="arrow.png" alt="x00">
  </div>
  </div>
  
  
  
  
  <!-- -end of alternative screens here -->

  </div>

 <script>
 
 
 
 
 
 
 
 
 
 
 function showblue() {
	 //document.getElementById("replace").style.background = "blue";
	 document.getElementById("bluescreen").style.display = "block";
	 document.getElementById("bluescreen").style.right = 0;
	 //document.getElementById("bluescreen").classList.add("bs");
	 //setTimeout(function() {document.getElementById("bluescreen").style.right = 0;},1990);
	 
	 
 }
 
 function showred() {
	 //document.getElementById("replace").style.background = "blue";
	 document.getElementById("redscreen").style.display = "block";
	 document.getElementById("redscreen").style.right = 0;
	 
 }
 
 function clearblue() {
	 //document.getElementById("replace").style.background = "blue";
	 
	 document.getElementById("bluescreen").style.right = "-100%";
	 document.getElementById("bluescreen").style.display = "none";
	 
 }
 
 function clearred() {
	 //document.getElementById("replace").style.background = "blue";
	 
	 document.getElementById("redscreen").style.right = "-100%";
	 document.getElementById("redscreen").style.display = "none";
	 
 }
 
 function hideIcons() {
	 
	 document.getElementById("icons").style.display = "none";
 }
 
 
 
 
 
 
 
 
 
 
 
 
 
 
 
 
 
 
 </script>
 
 
 
 </body>
